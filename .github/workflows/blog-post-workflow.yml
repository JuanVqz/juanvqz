name: Latest blog post workflow
on:
  schedule:
    # Daily at 14:00 UTC (08:00 America/Mexico_City).
    #
    # One hour after the blog's own deploy cron, which runs at 13:00 UTC and is
    # what publishes a scheduled post on its date. Running before it would read a
    # feed that does not have the new post yet, and the README would stay a day
    # behind every Tuesday.
    - cron: "0 14 * * *"

  # Run it by hand from the Actions tab, without waiting for the cron.
  workflow_dispatch:

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: "https://www.juanvasquez.dev/feed.xml"
          max_post_count: 10
